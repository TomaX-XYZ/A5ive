<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect width="800" height="400" rx="16" fill="url(#grid)"/>

  <!-- Left Side: A5 Workspace & Pick-and-Place Icon -->
  <g transform="translate(95, 75)">
    <!-- A5 Proportioned Frame (Ratio ~ 1 : 1.414 -> 176 x 250) -->
    <rect x="0" y="0" width="176" height="250" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Corner Registration Marks -->
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 164 24 L 164 12 L 152 12" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 12 226 L 12 238 L 24 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 164 226 L 164 238 L 152 238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Dimension Labels inside A5 -->
    <text x="88" y="234" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">148 × 210 mm</text>

    <!-- Gantry X-Rail -->
    <rect x="-14" y="102" width="204" height="12" rx="3" fill="#334155" stroke="#475569" stroke-width="1"/>
    <line x1="-10" y1="108" x2="186" y2="108" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Target SMD Component on Board -->
    <g transform="translate(88, 165)">
      <!-- Pads -->
      <rect x="-24" y="-14" width="6" height="4" fill="#38bdf8" opacity="0.6"/>
      <rect x="-24" y="-6" width="6" height="4" fill="#38bdf8" opacity="0.6"/>
      <rect x="-24" y="2" width="6" height="4" fill="#38bdf8" opacity="0.6"/>
      <rect x="-24" y="10" width="6" height="4" fill="#38bdf8" opacity="0.6"/>
      <rect x="18" y="-14" width="6" height="4" fill="#38bdf8" opacity="0.6"/>
      <rect x="18" y="-6" width="6" height="4" fill="#38bdf8" opacity="0.6"/>
      <rect x="18" y="2" width="6" height="4" fill="#38bdf8" opacity="0.6"/>
      <rect x="18" y="10" width="6" height="4" fill="#38bdf8" opacity="0.6"/>
      <!-- IC Chip Body -->
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="-10" cy="-10" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- Pick-and-Place Vacuum Nozzle Head -->
    <g transform="translate(88, 108)">
      <!-- Carriage -->
      <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Nozzle Shaft -->
      <rect x="-5" y="14" width="10" height="22" fill="#94a3b8"/>
      <!-- Nozzle Tip -->
      <polygon points="-3,36 3,36 1.5,48 -1.5,48" fill="#38bdf8"/>
      <!-- Vacuum Suction Effect -->
      <line x1="0" y1="50" x2="0" y2="55" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- Right Side: Typography & Branding -->
  <g transform="translate(320, 145)">
    <!-- Badge -->
    <rect x="0" y="-35" width="142" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
    <text x="71" y="-19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1">DESKTOP SMT</text>

    <!-- Main Title -->
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      A5 <tspan fill="url(#accentGrad)">PnP</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#cbd5e1" letter-spacing="2">
      SISTEMA PICK &amp; PLACE
    </text>

    <!-- Divider -->
    <rect x="2" y="95" width="60" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Slogan -->
    <text x="2" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Grande precisione, area di lavoro A5.
    </text>
  </g>
</svg>